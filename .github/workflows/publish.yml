name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.5 or 0.1.5). If empty, uses the current ref name.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")

          INPUT_TAG='${{ inputs.tag }}'
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG='${{ github.ref_name }}'
          fi

          TAG_VERSION="$TAG"
          TAG_VERSION="${TAG_VERSION#v}"

          echo "package.json version: $PKG_VERSION"
          echo "tag version:         $TAG_VERSION"

          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Prepare npm config (OIDC only)
        shell: bash
        run: |
          set -euo pipefail
          echo "registry=https://registry.npmjs.org/" > "$RUNNER_TEMP/.npmrc"

      - name: Publish
        env:
          # Force npm to use a clean config without any legacy tokens.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          # Override any repo/org-level secrets that may inject an expired token.
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: npm publish --ignore-scripts --provenance --access public
